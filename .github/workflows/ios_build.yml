name: iOS & Android KMP CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Android APK
        run: ./gradlew :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build iOS Frameworks (KMP)
        run: ./gradlew :app:linkDebugFrameworkIosArm64 :app:linkDebugFrameworkIosSimulatorArm64
      - name: Build iOS Application (.ipa)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ios/Payload
          cp -r build/ios/Build/Products/Debug-iphoneos/iosApp.app build/ios/Payload/
          cd build/ios
          zip -r iosApp.ipa Payload
      - name: Upload iOS .ipa Package (For Sideloadly / AltStore / 3uTools)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-package
          path: build/ios/iosApp.ipa
          if-no-files-found: warn
