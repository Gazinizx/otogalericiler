name: iOS App Store Upload

on:
  workflow_dispatch:

jobs:
  ios-app-store:
    runs-on: macos-latest
    env:
      IOS_BUNDLE_ID: com.anadolugalericilersitesi.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v3

      - name: Build iOS release framework
        run: ./gradlew :app:linkReleaseFrameworkIosArm64

      - name: Install signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          case "$PROFILE_APP_ID" in
            *."$IOS_BUNDLE_ID") ;;
            *) echo "::error::Provisioning profile App ID does not match $IOS_BUNDLE_ID"; exit 1 ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_TEAM_ID=$TEAM_ID"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
          } >> "$GITHUB_ENV"

      - name: Set build number
        shell: bash
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" iosApp/iosApp/Info.plist
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Archive app
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AnadoluOtogalericiler.xcarchive" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER"

      - name: Export IPA
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AnadoluOtogalericiler.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Prepare and validate App Store Connect API key
        shell: bash
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          chmod 700 "$RUNNER_TEMP"
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ.get("API_PRIVATE_KEY", "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          if not key.startswith("-----BEGIN PRIVATE KEY-----") or not key.endswith("-----END PRIVATE KEY-----"):
              raise SystemExit("::error::APP_STORE_CONNECT_PRIVATE_KEY must contain the complete PEM .p8 key, including BEGIN/END lines.")
          path = Path(os.environ["KEY_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(key + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::The GitHub private-key secret is not a valid PEM private key. Copy the complete contents of the App Store Connect .p8 file into the secret."
            exit 1
          fi
          echo "API key file format validated."

      - name: Upload IPA to App Store Connect
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY_ID//[[:space:]]/}" ]]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID is empty or unavailable to this workflow. Recreate this GitHub Actions secret with the App Store Connect API Key ID."
            exit 1
          fi
          if [[ -z "${API_ISSUER_ID//[[:space:]]/}" ]]; then
            echo "::error::APP_STORE_CONNECT_ISSUER_ID is empty or unavailable to this workflow. Recreate this GitHub Actions secret with the App Store Connect Issuer ID."
            exit 1
          fi
          xcrun altool --output-format xml \
            --upload-app \
            --file "$RUNNER_TEMP/ios-export/iosApp.ipa" \
            --type ios \
            --api-key "$API_KEY_ID" \
            --api-issuer "$API_ISSUER_ID"
